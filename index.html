<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Little Space – Private Shared Journal &amp; Memories for Two</title>
    <meta
      name="description"
      content="Our Little Space is a private digital scrapbook, shared notes feed, photo memories gallery, and illustrated sticker space made exclusively for two people."
    />
    <meta name="theme-color" content="#6554A4" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Our Little Space" />
    <meta property="og:title" content="Our Little Space – Private Shared Journal &amp; Memories for Two" />
    <meta
      property="og:description"
      content="A cozy, private digital corner for two people to share daily notes, photo memories, and expressive cat stickers."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Our Little Space – Private Shared Journal &amp; Memories for Two" />
    <meta
      name="twitter:description"
      content="A cozy, private digital corner for two people to share daily notes, photo memories, and expressive cat stickers."
    />

    <!-- Google Fonts: Plus Jakarta Sans + DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Our Little Space",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "All",
        "description": "A private shared notes, photo memories, and illustrated sticker journal designed exclusively for two people.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      (function () {
        try {
          var sysDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var raw = window.localStorage.getItem('ols_theme_cache');
          var parsed = raw ? JSON.parse(raw) : null;
          var themeMode = parsed && parsed.themeMode ? parsed.themeMode : 'system';
          var romanticMode = Boolean(parsed && parsed.romanticMode);
          var overlayMode = parsed && parsed.overlayMode === 'light' ? 'light' : 'dark';
          var effective = romanticMode
            ? 'romantic'
            : themeMode === 'custom' && parsed && parsed.hasCustomBg
              ? 'custom'
              : themeMode === 'dark' || (themeMode === 'system' && sysDark)
                ? 'dark'
                : 'light';
          var surface =
            effective === 'dark' || (effective === 'custom' && overlayMode === 'dark')
              ? 'dark'
              : 'light';
          var root = document.documentElement;
          root.dataset.theme = effective;
          root.dataset.surface = surface;
          root.classList.toggle('dark', surface === 'dark');
        } catch (e) {
          var fallbackDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = fallbackDark ? 'dark' : 'light';
          document.documentElement.dataset.surface = fallbackDark ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', fallbackDark);
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-[var(--accent-soft-strong)] selection:text-[var(--text-primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
